# Wiederverwendbare CI/CD-Pipeline fuer AppStore-Apps (Pods).
# Aufruf aus dem App-Repo: siehe templates/app-ci-caller.yml
# Ablauf: appstore.yaml pruefen -> hadolint -> bauen -> Smoke-Test -> Trivy -> push -> Digests einsammeln.
# Jeder Build bekommt das Build-Argument SECURITY_REFRESH (die Run-ID): ein Dockerfile, das es vor seinem
# apt-get/apk upgrade deklariert, holt damit bei jedem Lauf die aktuellen Sicherheitsupdates (README,
# "Sicherheitsupdates im Image").
name: app-ci

on:
  workflow_call:
    inputs:
      app-name:
        description: "Image-Name unter ghcr.io/dhbw-appstore-t3/apps/ (Default: Repo-Name in Kleinbuchstaben)"
        type: string
        default: ""
      images:
        description: >-
          JSON-Liste der zu bauenden Images. Je Eintrag: suffix (optional, wird mit - an den App-Namen gehaengt),
          context, dockerfile und optional smoke_test (Pfad eines Skripts im App-Repo, siehe templates/smoke-test-example.sh).
          Default: ein Image aus ./Dockerfile.
        type: string
        default: '[{"suffix":"","context":".","dockerfile":"Dockerfile"}]'
      appstore-yaml:
        description: "Pfad zur appstore.yaml"
        type: string
        default: "appstore.yaml"
      strict-image-pin:
        description: "true = Tags in appstore.yaml sind ein Fehler (nur @sha256 erlaubt). false = nur Warnung (Digest existiert vor dem ersten Build noch nicht)."
        type: boolean
        default: false
      trivy-severity:
        description: "Schweregrade, bei denen der Scan fehlschlaegt (nur behebbare Funde)"
        type: string
        default: "HIGH,CRITICAL"
      push:
        description: "Image nach ghcr.io pushen (nur bei push-Events, nie bei Pull Requests)"
        type: boolean
        default: true
      registry-ref:
        description: >-
          Optional. Ref von DHBW-AppStore-T3/app-registry, aus dem der Validator geholt wird. Leer (Standard): derselbe
          Commit, aus dem dieser Workflow geladen wurde (job.workflow_sha), Pipeline und Validator sind also immer im
          selben Stand. Nur fuer Sonderfaelle setzen.
        type: string
        default: ""
    outputs:
      digest:
        description: "Digest des (alphabetisch) ersten Images, bei einem Image dieses (sha256:...)"
        value: ${{ jobs.collect.outputs.digest }}
      digests:
        description: "JSON-Objekt image-ref -> digest fuer alle Images"
        value: ${{ jobs.collect.outputs.digests }}
      image:
        description: "Vollstaendige Referenz des (alphabetisch) ersten Images: ghcr.io/...@sha256:..."
        value: ${{ jobs.collect.outputs.image }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # App-Images liegen unter apps/, getrennt von den Plattform-Images (backend, worker, frontend).
  ORG: dhbw-appstore-t3/apps

jobs:
  validate:
    name: appstore.yaml validieren
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DHBW-AppStore-T3/app-registry
          ref: ${{ inputs.registry-ref || job.workflow_sha }}
          path: .app-registry
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Vertrag pruefen (app contract v2)
        env:
          SPEC: ${{ inputs.appstore-yaml }}
          STRICT: ${{ inputs.strict-image-pin }}
        run: |
          flags=""
          [ "$STRICT" = "true" ] || flags="--allow-tags"
          python .app-registry/scripts/validate_appstore_yaml.py "$SPEC" $flags

  lint:
    name: Dockerfile-Lint (hadolint) ${{ matrix.image.dockerfile }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.image.dockerfile }}
          failure-threshold: warning

  build:
    name: Build, Scan, Push ${{ matrix.image.dockerfile }}
    runs-on: ubuntu-latest
    needs: [validate, lint]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Image-Namen berechnen
        id: meta
        env:
          APP_INPUT: ${{ inputs.app-name }}
          REPO: ${{ github.event.repository.name }}
          SUFFIX: ${{ matrix.image.suffix }}
          SHA: ${{ github.sha }}
          IS_MAIN: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          app="${APP_INPUT:-$REPO}"
          app="$(echo "$app" | tr '[:upper:]' '[:lower:]')"
          [ -n "$SUFFIX" ] && app="$app-$SUFFIX"
          if ! echo "$app" | grep -Eq '^[a-z0-9][a-z0-9._-]*$'; then
            echo "::error::ungueltiger Image-Name: $app"; exit 1
          fi
          image="$REGISTRY/$ORG/$app"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "key=${app}" >> "$GITHUB_OUTPUT"
          tags="$image:$SHA"
          [ "$IS_MAIN" = "true" ] && tags="$tags"$'\n'"$image:latest"
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (lokal, fuer den Scan)
        id: scan-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          load: true
          push: false
          tags: scan-target:${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.key }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.key }}
          # Ein neuer Wert je Lauf: der Build-Cache kann einen Upgrade-Schritt, der nach ARG SECURITY_REFRESH
          # steht, nicht aus einem frueheren Lauf wiederverwenden (sonst bleibt das Image auf dem Paketstand des
          # ersten Builds stehen, auch wenn die Distribution laengst Fixes hat). Schritte vor dem ARG bleiben
          # gecacht. Dockerfiles ohne dieses ARG ignorieren es.
          build-args: SECURITY_REFRESH=${{ github.run_id }}

      # Das lokal gebaute Image, bevor irgendetwas gepusht wird. Das Skript startet es selbst (docker run) mit
      # $PLATFORM_RUN_FLAGS, dem Sicherheitskontext der Plattform, und prueft, dass die App darin laeuft.
      - name: Smoke-Test (Sicherheitskontext der Plattform)
        if: matrix.image.smoke_test
        env:
          SMOKE_TEST: ${{ matrix.image.smoke_test }}
          IMAGE: scan-target:${{ github.sha }}
          PLATFORM_RUN_FLAGS: --user 1000:1000 --read-only --cap-drop ALL --security-opt no-new-privileges --network host
        run: bash "$SMOKE_TEST"
      - name: Smoke-Test aufraeumen
        if: always() && matrix.image.smoke_test
        run: docker ps -aq | xargs -r docker rm -f

      - name: Trivy-Scan (behebbare HIGH/CRITICAL brechen den Build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target:${{ github.sha }}
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      # Funde ohne verfuegbaren Fix brechen den Build nicht ab (es gaebe nichts zu tun), sollen aber sichtbar sein:
      # derselbe Scan noch einmal ohne ignore-unfixed, nur als Bericht in der Job-Summary. Laeuft auch, wenn das
      # Gate oben rot ist, und schlaegt selbst nie fehl. Ausnahmen aus .trivyignore bleiben ausgenommen.
      - name: Trivy-Bericht (alle Funde, auch ohne Fix; bricht nicht ab)
        if: ${{ !cancelled() && steps.scan-build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target:${{ github.sha }}
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: false
          exit-code: "0"
          vuln-type: os,library
          format: table
          output: trivy-all.txt
          skip-setup-trivy: true

      - name: Trivy-Bericht in die Job-Summary
        if: ${{ !cancelled() && steps.scan-build.outcome == 'success' }}
        env:
          DOCKERFILE: ${{ matrix.image.dockerfile }}
          SEVERITY: ${{ inputs.trivy-severity }}
        run: |
          {
            echo "### Trivy: alle $SEVERITY-Funde in \`$DOCKERFILE\`, auch ohne Fix"
            echo
            echo "Nur zur Information: den Build brechen nur Funde mit Fix (Spalte *Status* = \`fixed\`, Schritt davor)."
            echo "\`affected\` / \`will_not_fix\`: es gibt noch keinen Fix; wieder pruefen, wenn die Distribution oder das Paket einen liefert."
            echo
            echo '```'
            if [ -s trivy-all.txt ]; then cat trivy-all.txt; else echo "keine Funde"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login ghcr.io
        if: inputs.push && github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: inputs.push && github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Links the ghcr.io package to this repo: without it a later push with GITHUB_TOKEN is refused.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.key }}
          # Derselbe Wert wie beim Scan-Build: die Schichten kommen aus dessen Cache, gepusht wird der gescannte Stand.
          build-args: SECURITY_REFRESH=${{ github.run_id }}
          provenance: false

      - name: Digest festhalten
        if: steps.push.outcome == 'success'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          KEY: ${{ steps.meta.outputs.key }}
        run: |
          mkdir -p out
          printf '{"%s":"%s"}\n' "$IMAGE" "$DIGEST" > "out/$KEY.json"
          {
            echo "### $IMAGE"
            echo "Digest: \`$DIGEST\`"
            echo "In appstore.yaml eintragen: \`image: $IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.push.outcome == 'success'
        with:
          name: digest-${{ steps.meta.outputs.key }}
          path: out/
          retention-days: 7

  collect:
    name: Digests einsammeln
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' && inputs.push && github.event_name != 'pull_request'
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      digests: ${{ steps.merge.outputs.digests }}
      image: ${{ steps.merge.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - id: merge
        run: |
          jq -s 'add' digests/*.json > all.json
          {
            echo "digests=$(jq -c . all.json)"
            echo "digest=$(jq -r 'to_entries|sort_by(.key)|.[0].value' all.json)"
            echo "image=$(jq -r 'to_entries|sort_by(.key)|.[0]|.key+"@"+.value' all.json)"
          } >> "$GITHUB_OUTPUT"
