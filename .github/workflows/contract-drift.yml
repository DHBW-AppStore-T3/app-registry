name: contract-drift

# Der Validator spiegelt app/k8s/spec.py des Backends (Branch dev). Dieser Check laesst beide dieselben
# zufaellig verfaelschten appstore.yaml bewerten und schlaegt fehl, sobald sie sich widersprechen,
# z.B. wenn das Backend ein Feld ergaenzt. Zusaetzlich werden die Obergrenzen (CPU/RAM/Speicher) mit dem
# deployten Helm-Chart verglichen; ein Unterschied ist eine Warnung (siehe scripts/check_platform_limits.py).
on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["scripts/validate_appstore_yaml.py", "scripts/check_platform_limits.py", "tests/**", ".github/workflows/contract-drift.yml"]

permissions:
  contents: read

jobs:
  drift:
    name: Validator gegen Backend-Vertrag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml jsonschema pydantic
      - name: spec.py aus dem Backend (dev) holen
        run: curl -fsSL -o "$RUNNER_TEMP/spec.py" https://raw.githubusercontent.com/DHBW-AppStore-T3/backend/dev/app/k8s/spec.py
      - name: Gleiches Urteil wie das Backend
        env:
          BACKEND_SPEC_PY: ${{ runner.temp }}/spec.py
        run: python -m unittest discover -s tests -p "test_contract_drift.py" -v
      - name: Obergrenzen wie im deployten Chart?
        run: python scripts/check_platform_limits.py
